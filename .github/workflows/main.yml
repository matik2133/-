name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen ldid
      - run: xcodegen generate
      - run: |
          xcodebuild -project Pary.xcodeproj -scheme Pary -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          APP=build/Build/Products/Release-iphoneos/Pary.app
          ldid -SPary/Pary.entitlements $APP/Pary
          ldid -SParyWidget/ParyWidget.entitlements $APP/PlugIns/ParyWidget.appex/ParyWidget
          mkdir Payload
          cp -R $APP Payload/
          zip -r Pary.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Pary-ipa
          path: Pary.ipa
