name: Pary
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pary:
    type: application
    platform: iOS
    sources: [Pary, Shared]
    info:
      path: Pary/Info.plist
      properties:
        CFBundleDisplayName: Пары
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Pary/Pary.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.pary]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pary
    dependencies:
      - target: ParyWidget
  ParyWidget:
    type: app-extension
    platform: iOS
    sources: [ParyWidget, Shared]
    info:
      path: ParyWidget/Info.plist
      properties:
        CFBundleDisplayName: Пары
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ParyWidget/ParyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.pary]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pary.widget
